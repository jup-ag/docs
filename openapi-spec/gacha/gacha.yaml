        - platform
        - status
        - reference
    MachinePurchase:
      type: object
      properties:
        machineId:
          type: string
        platform:
          type: string
        chunks:
          type: integer
          description: Transactions to sign, and therefore `open` calls to make. Usually 1, but more when the quantity exceeds the machine's `maxPerPurchase`, or when the platform issues one transaction per pack regardless of the cap (Collector Crypt does).
        packs:
          type: array
          items:
            type: object
            properties:
              reference:
                type: string
              transaction:
                type: string
              intent:
                type: string
                description: Gateway intent id; pass back as `intent` on open so a stale transaction is rejected here
              quantity:
                type: integer
                description: Packs this transaction buys, and its open reveals
            required:
              - reference
              - transaction
              - quantity
          description: Unsigned base64 transaction per pack, with the reference to open it
        next:
          type: string
          description: The route to call next
      required:
        - machineId
        - platform
        - chunks
        - next
    MachineV2:
