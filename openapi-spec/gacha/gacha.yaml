  /users/{wallet}/stats:
    get:
      summary: A wallet's lifetime volume, total and per platform
      description: "Read from the shared pull ledger, so a Collector Crypt pull and a Phygitals pull count the same. Only settled purchases count, an intent that was created and never paid is excluded, so `spendUsd` agrees with the wallet's leaderboard volume. `wonUsd` is not measured identically across platforms: Collector Crypt reports a strict insured valuation, Phygitals falls back to the card's own quote."
      tags:
        - Users
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          required: true
          name: wallet
          in: path
      responses:
        "200":
          description: Lifetime stats; zeroed for a wallet that has never played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "400":
          description: Malformed request
  /users/{wallet}/activity:
    get:
      summary: A wallet's pull history across every platform
      description: Newest first. Paged by keyset on `id` rather than offset, so rows landing mid-scroll never shift the page under the reader, pass the previous response's `nextCursor` to continue.
      tags:
        - Users
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          required: true
          name: wallet
          in: path
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type: string
            pattern: ^[1-9]\d*$
            description: "`nextCursor` from the previous page"
          required: false
          description: "`nextCursor` from the previous page"
          name: cursor
          in: query
      responses:
        "200":
          description: Pull history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullActivity"
        "400":
          description: Malformed request
  /latest-pulls:
    get:
      summary: Recent pulls across every platform
      description: |-
        The live activity feed, newest first, read from Jupiter's own pull ledger, so it covers Collector Crypt, Phygitals and every future platform.

        No wallet is returned: this feed is public, and who pulled what is not part of it.

        Paged by keyset on `id` rather than offset, so pulls landing mid-scroll never shift the page under the reader. Two directions: `cursor` walks backwards into history, `since` polls forwards for what is new. Pass both to fetch a bounded window, which is how a client that fell behind by more than one page backfills the gap.
      tags:
        - Pulls
      parameters:
        - schema:
            type: string
            description: Filter to one machine, e.g. `phygitals:dollar-sport-pack`. Omit for every machine.
            example: phygitals:dollar-sport-pack
          required: false
          description: Filter to one machine, e.g. `phygitals:dollar-sport-pack`. Omit for every machine.
          name: machine
          in: query
        - schema:
            type: string
            pattern: ^[1-9]\d*$
            description: "Poll for what is new: only pulls with an id greater than this. Pass the newest `id` you have already shown. Usually returns an empty list, which is the point."
          required: false
          description: "Poll for what is new: only pulls with an id greater than this. Pass the newest `id` you have already shown. Usually returns an empty list, which is the point."
          name: since
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          required: false
          name: limit
          in: query
        - schema:
            type: string
            pattern: ^[1-9]\d*$
            description: "`nextCursor` from the previous page"
          required: false
          description: "`nextCursor` from the previous page"
          name: cursor
          in: query
      responses:
        "200":
          description: Recent pulls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestPulls"
        "400":
          description: Malformed request
  /transactions/submit:
    post:
      summary: Submit signed transactions for any pending intent
      description: The gateway for every build-sign-submit flow. Pass the `reference` returned by a build endpoint (marketplace buy/sell/list/delist, ...) plus the signed transaction(s); the gateway dispatches them to the right platform. Resubmitting a finalised reference replays its stored result (idempotent).
      tags:
        - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                  format: uuid
                signedTransactions:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
              required:
                - reference
                - signedTransactions
      responses:
        "200":
          description: Submission outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TxSubmitResult"
        "404":
          description: Unknown reference
        "410":
          description: Intent expired before submission
        "451":
          description: Unavailable in the caller's region
        "501":
          description: No submitter registered for this intent kind
  /transactions/submit-batch:
    post:
      summary: Submit signed transactions for several intents at once
      description: "One round trip for a batch built by POST /gacha/gacha/v2/buyback. Each reference is dispatched independently and reported in request order, so a single failure never rejects the batch, a well-formed request returns 200 even when every entry failed, so branch on each entry's `ok`. Identical to calling POST /gacha/gacha/v2/transactions/submit per reference, including its idempotency: a replayed reference returns its stored result."
      tags:
        - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submissions:
                  type: array
                  items:
                    type: object
                    properties:
                      reference:
                        type: string
                        format: uuid
                      signedTransactions:
                        type: array
                        items:
                          type: string
                          minLength: 1
                        minItems: 1
                    required:
                      - reference
                      - signedTransactions
                  minItems: 1
                  maxItems: 10
              required:
                - submissions
      responses:
        "200":
          description: Per-reference outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TxBatchSubmitResult"
        "400":
          description: Malformed request, a required field is missing or invalid
        "451":
          description: Unavailable in the caller's region
  /transactions/{reference}:
    get:
      summary: Status of a transaction intent
      tags:
        - Transactions
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: reference
          in: path
      responses:
        "200":
          description: Intent status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TxIntentStatus"
        "404":
          description: Unknown reference
      description: The current state of a transaction intent (`pending`, `submitted` or `failed`) with its stored result. Use it to poll a submission or audit one after the fact.
components:
  schemas:
    BulkBuybackPlan:
      type: object
      properties:
        plans:
          type: array
          items:
            type: object
            properties:
              asset:
                type: string
              reference:
                type: string
                description: Transaction-gateway intent id; pass to POST /gacha/gacha/v2/transactions/submit-batch
              platform:
                type: string
              transactions:
                type: array
                items:
                  type: string
                description: Base64 unsigned transaction(s) to sign
              expiresAt:
                type: string
              detail:
                type: object
                additionalProperties: {}
                description: Proceeds, when the platform reports them
            required:
              - asset
              - reference
              - platform
              - transactions
              - expiresAt
        failed:
          type: array
          items:
            type: object
            properties:
              asset:
                type: string
              code:
                type: string
              message:
                type: string
            required:
              - asset
              - code
              - message
          description: Assets that could not be sold; the rest of the batch still succeeded
        next:
          type: string
          description: The route to call next
      required:
        - plans
        - failed
        - next
    BuybackQuote:
      type:
        - object
        - "null"
      properties:
        amountUsd:
          type: number
          description: USD the platform pays right now for this asset
        amountUsdc:
          type: integer
          description: Same amount in USDC minor units (6 decimals), as quoted upstream
        expiresAt:
          type: string
          description: ISO expiry when the platform's offer is time-boxed (Phygitals); absent means a standing bid (Collector Crypt)
      required:
        - amountUsd
        - amountUsdc
      description: Standing instant-sell (buyback) quote; null when the platform offers none for this asset or quoting is unavailable
    BuybackTxPlan:
      type: object
      properties:
        reference:
          type: string
          description: Transaction-gateway intent id; pass to POST /gacha/gacha/v2/transactions/submit
        platform:
          type: string
        action:
          type: string
          enum:
            - buy
            - sell
            - list
            - delist
        asset:
          type: string
        transactions:
          type: array
          items:
            type: string
          description: Base64 unsigned transaction(s) to sign
        expiresAt:
          type: string
        detail:
          type: object
          additionalProperties: {}
        next:
          type: string
          description: The route to call next
      required:
        - reference
        - platform
        - action
        - asset
        - transactions
        - expiresAt
        - next
