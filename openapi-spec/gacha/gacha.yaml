  /buyback:
    post:
      summary: Instant-sell several items back to their platform
      description: "Builds one buyback transaction per asset in a single round trip, so a wallet can cover them all with one signAllTransactions approval. Not atomic: no platform accepts a batched sellback on this rail, so each asset is planned independently and settles independently. An asset the platform will not repurchase is reported under `failed` and the rest of the batch still returns 200, check both arrays. Each plan carries its own `reference`; complete them with POST /gacha/gacha/v2/transactions/submit-batch."
      tags:
        - Buyback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet:
                  type: string
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  description: Seller wallet, which must hold every asset
                platform:
                  type: string
                  description: The platform every asset in this batch belongs to. Optional. When given, each mint is checked against it and a mint from another platform fails the whole request with `wrong_platform` before anything is built.
                assets:
                  type: array
                  items:
                    type: string
                    pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  minItems: 1
                  maxItems: 10
                  description: Asset mint addresses to sell back (max 10)
              required:
                - wallet
                - assets
      responses:
        "200":
          description: Buyback plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkBuybackPlan"
        "400":
          description: Malformed request, an unknown `platform`, or a mint that belongs to a different platform
        "403":
          description: The wallet does not hold the asset
        "404":
          description: Unknown asset
        "451":
          description: Unavailable in the caller's region
        "501":
          description: Platform doesn't support buyback through this API
        "502":
          description: Platform unavailable
