    MachineOpenResult:
      type: object
      properties:
        machineId:
          type: string
        platform:
          type: string
        status:
          type: string
          enum:
            - fulfilled
            - pending
            - failed
        statusDetail:
          type: string
          description: 'Upstream state name when the platform distinguishes more than we do (phygitals: processing, debited, review). "review" stays pending but is parked for manual reconciliation and is never auto-refunded. collector-crypt: "turbo-mode-buyback" means the platform kept the won card and paid its buyback instead of delivering it, `status` is still "fulfilled", the item is reported with its `buybackUsd`, and the wallet will not receive it.'
        reference:
          type: string
        wallet:
          type: string
          description: Wallet the platform delivers the won items to, when it accepts one
        transactionSignature:
          type: string
          description: On-chain signature of the fulfilling transaction, when the platform returns one
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              image:
                type: string
              imageBack:
                type: string
                description: Back of the card, when the platform publishes one, for the reveal flip
              enrichment:
                allOf:
                  - $ref: "#/components/schemas/Enrichment"
                  - description: "Grade, year, set and cert, read from the asset's metadata. The platform's own open payload carries none of it. Best-effort: absent if the lookup failed."
              rarity:
                type: string
              valueUsd:
                type: number
              insuredValueUsd:
                type: number
                description: Platform's insured valuation, when quoted separately from `valueUsd`. `valueUsd` prefers the card's own market quote and falls back to this.
              buybackUsd:
                type: number
            required:
              - id
      required:
