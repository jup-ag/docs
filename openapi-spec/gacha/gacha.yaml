  /rewards/battlepass/claim:
    post:
      summary: Claim earned battlepass tiers
      description: "Claims every tier the wallet has earned and not yet claimed, in one call. `wallet` must be a base58 Solana address. Requires a wallet signature over the canonical claim message. Returns 202: the packs are queued, not delivered, poll GET /gacha/gacha/v2/rewards/battlepass and watch each tier go `delivering` then `delivered`."
      tags:
        - Rewards
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    wallet:
                      type: string
                      minLength: 1
                    signedMessage:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: 'Canonical claim message, signed as raw UTF-8: "Claim my Jupiter TCG rewards!\nWallet:<wallet>\nExpires:<unixMs>". Expires must be within 10 minutes of server time.'
                    signature:
                      type: string
                      minLength: 1
                      maxLength: 128
                      description: base58 ed25519 signature of `signedMessage` (Solana convention).
                  required:
                    - wallet
                    - signedMessage
                    - signature
                  additionalProperties: false
                - type: object
                  properties:
                    wallet:
                      type: string
                      minLength: 1
                    signedTransaction:
                      type: string
                      minLength: 1
                      maxLength: 4096
                      description: Base64-encoded, partially signed Solana transaction containing the canonical claim message as a Memo instruction, plus optional wallet-added compute-unit price and limit instructions. The API verifies it but never broadcasts it.
                  required:
                    - wallet
                    - signedTransaction
                  additionalProperties: false
      responses:
        "202":
          description: Tiers queued for delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduledTierIds:
                    type: array
                    items:
                      type: string
                required:
                  - scheduledTierIds
        "400":
          description: Malformed request
        "401":
          description: Claim proof missing, invalid, or expired
  /rewards/leaderboard/claim:
    post:
