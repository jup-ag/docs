openapi: 3.1.0
info:
  title: Jupiter Gacha API
  version: 0.1.0
  description: "One normalised API over every integrated collectible-gacha platform (Collector Crypt, Phygitals and Beezie): pack catalogue, machines, prize inventory, wallet collectibles, marketplace, buyback, rewards and the transaction gateway. No API key is required. Money-moving endpoints return 451 `region_restricted` from blocked regions."
servers:
  - url: https://api.raccoons.dev/gacha/v2
    description: Jupiter Gacha API
security: []
tags:
  - name: Packs
    description: "Jupiter's curated pack catalogue: the storefront, its categories and each pack's live price."
  - name: Machines
    description: Every platform's live gacha machines, their prize pools, and the purchase and open flow.
  - name: Inventory
    description: A wallet's gacha collectibles and single-asset lookups, enriched with grades and values.
  - name: Collections
    description: The whitelisted collections whose assets count as gacha collectibles.
  - name: Marketplace
    description: Browse listings and build buy, list and delist transactions.
  - name: Buyback
    description: Instant-sell items back into a platform's standing bid.
  - name: Transactions
    description: The build, sign, submit gateway behind every money-moving flow.
  - name: Pulls
    description: The public, cross-platform feed of recent pulls.
  - name: Users
    description: Per-wallet lifetime stats and pull history.
  - name: Rewards
    description: Seasonal leaderboards, battlepass progress and prize claims.
paths:
  /inventory/{address}:
    get:
      summary: Gacha collectibles owned by a wallet
      description: Fetches the wallet's assets from DAS, keeps only whitelisted gacha collections, and returns one page (sorted by asset id). Only the returned page is enriched, best-effort, via the collection's partner API. Inventory is cached 30s per wallet (stale-served if the upstream is down); enrichment is cached per asset with a long TTL.
      tags:
        - Inventory
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          required: true
          name: address
          in: path
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          required: false
          name: limit
          in: query
        - schema:
            type: string
            description: Filter to specific whitelisted collection address(es), comma-separated
          required: false
          description: Filter to specific whitelisted collection address(es), comma-separated
          name: collection
          in: query
        - schema:
            type: string
            description: Filter to one platform's collections. Combines with `collection` by intersection.
          required: false
          description: Filter to one platform's collections. Combines with `collection` by intersection.
          name: platform
          in: query
      responses:
        "200":
          description: Owned whitelisted collectibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "502":
          description: Asset provider unavailable and no cached inventory
  /collectibles/{id}:
    get:
      summary: One collectible by asset id
      description: Looks up a single asset via DAS, keeps it only if it belongs to a whitelisted gacha collection, and enriches it best-effort exactly like an inventory page item.
      tags:
        - Inventory
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            description: Asset id (mint address)
          required: true
          description: Asset id (mint address)
          name: id
          in: path
      responses:
        "200":
          description: Collectible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collectible"
        "404":
          description: Unknown, burnt, or non-whitelisted asset
        "502":
          description: Asset provider unavailable
  /machines:
    get:
      summary: All gacha machines across platforms
      description: Aggregates every platform's live machine feed into one normalised list. Sold-out machines are omitted unless `status=sold_out` is requested. A failing platform drops out of the list rather than failing the request, it is named in the `x-degraded-sources` response header; feeds are cached 30s with stale fallback.
      tags:
        - Machines
      parameters:
        - schema:
            type: string
            description: Filter to one platform
          required: false
          description: Filter to one platform
          name: platform
          in: query
        - schema:
            type: string
            enum:
              - active
              - sold_out
              - inactive
            description: Filter by machine status. Omitted, sold-out machines are excluded; pass `sold_out` to fetch them.
          required: false
          description: Filter by machine status. Omitted, sold-out machines are excluded; pass `sold_out` to fetch them.
          name: status
          in: query
        - schema:
            type: string
            enum:
              - price
              - ev
              - buyback
            description: Sort by priceUsd, evUsd, or buybackPercent; feed order when omitted. Machines missing the sorted field sort last.
          required: false
          description: Sort by priceUsd, evUsd, or buybackPercent; feed order when omitted. Machines missing the sorted field sort last.
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
      responses:
        "200":
          description: Machines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MachineV2"
        "400":
          description: Unknown platform
  /machines/inventory:
    get:
      summary: Prize inventory across all machines
      description: Every prize in every machine, each item attributed to the machine it is available in. Sorted by value (desc). A failing machine drops its items rather than failing the request. Phygitals only publishes chase (highlight) items, see `machine.coverage`.
      tags:
        - Machines
      parameters:
        - schema:
            type: string
          required: false
          name: rarity
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: minValueUsd
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: maxValueUsd
          in: query
        - schema:
            type: string
            enum:
              - value
              - name
            default: value
            description: Items missing the sorted field go last
          required: false
          description: Items missing the sorted field go last
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          required: false
          name: limit
          in: query
        - schema:
            type: string
          required: false
          name: platform
          in: query
        - schema:
            type: string
            enum:
              - active
              - sold_out
              - inactive
            description: Only machines with this status
          required: false
          description: Only machines with this status
          name: status
          in: query
        - schema:
            type: string
            description: Filter to machine id(s) `{platform}:{platformMachineId}`, comma-separated
          required: false
          description: Filter to machine id(s) `{platform}:{platformMachineId}`, comma-separated
          name: machine
          in: query
      responses:
        "200":
          description: Aggregated machine inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineInventoryPage"
        "400":
          description: Unknown platform
  /machines/{id}/inventory:
    get:
      summary: Prize inventory of one machine
      tags:
        - Machines
      parameters:
        - schema:
            type: string
            description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          required: true
          description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          name: id
          in: path
          example: phygitals:starter-one-piece-pack-2xcfbo
        - schema:
            type: string
          required: false
          name: rarity
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: minValueUsd
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: maxValueUsd
          in: query
        - schema:
            type: string
            enum:
              - value
              - name
            default: value
            description: Items missing the sorted field go last
          required: false
          description: Items missing the sorted field go last
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Machine inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleMachineInventory"
        "404":
          description: Not found
        "501":
          description: Platform doesn't expose machine inventory
      description: The prize pool of one machine, paged and filterable by rarity and value. Collector Crypt publishes the full pool; Phygitals and Beezie publish chase (highlight) items only, see `machine.coverage`. Returns 501 when the platform exposes no inventory.
  /machines/{id}/purchase:
    post:
      summary: Initiate a pull purchase
      description: |-
        Normalised first step of every platform's purchase flow: one unsigned transaction per pack under `packs`, each with the `reference` and `intent` to open it. No money moves here. Complete the flow with POST /gacha/gacha/v2/machines/{id}/open, once per pack.

        Every platform caps a single buy (Phygitals `max_per_mint` is 5 on $1 packs, 8 on most others), so a `quantity` above that cap is split into several transactions rather than rejected, `chunks` says how many, and each pack carries the `quantity` its open reveals. Platforms differ in how they divide a buy: Phygitals returns one transaction covering several packs, Collector Crypt one transaction per pack. Read `packs[].quantity` rather than assuming; the values always sum to the `quantity` requested. The split follows the machine's live `maxPerPurchase`, so a cap the platform raises applies without a deploy. Sign them all; a wallet's signAllTransactions keeps that to one approval. Not atomic: each transaction settles independently, so a partial result is possible and the client must report it.
      tags:
        - Machines
      parameters:
        - schema:
            type: string
            description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          required: true
          description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          name: id
          in: path
          example: phygitals:starter-one-piece-pack-2xcfbo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                player:
                  type: string
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  description: Player wallet paying for and receiving the pull
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 1
                  description: Total packs to buy, split across transactions as the machine's cap requires (max 20)
                currency:
                  type: string
                  description: SPL mint address to pay in; must be one of the machine's `acceptedCurrencies`. Defaults to the machine's `currency` (USDC).
                  example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              required:
                - player
      responses:
        "200":
          description: Purchase initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachinePurchase"
        "400":
          description: Malformed request, a required field is missing or invalid
        "402":
          description: The wallet cannot cover the total cost of the requested quantity
        "404":
          description: Not found
        "409":
          description: The machine is sold out or switched off
        "451":
          description: Unavailable in the caller's region
        "501":
          description: Platform doesn't support purchase through this API
        "502":
          description: Platform unavailable
  /machines/{id}/open:
    post:
      summary: Complete a purchase and reveal won items
      description: Pass the `player`, `reference` and `intent` from purchase plus `signedTransactions`, one call per pack. A reference whose transaction has expired returns 410 `intent_expired`, call purchase again. While `status` is "pending" (Phygitals settles asynchronously) poll this endpoint with the reference it returned and no `signedTransactions`.
      tags:
        - Machines
      parameters:
        - schema:
            type: string
            description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          required: true
          description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          name: id
          in: path
          example: phygitals:starter-one-piece-pack-2xcfbo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reference:
                  type: string
                  description: "With `signedTransactions`: the `reference` from purchase, rejected with 410 once expired. Without them: the session reference to poll."
                intent:
                  type: string
                  description: "Collector Crypt: the `intent` returned alongside the pack, rejected with 410 once expired. Optional, omit to keep the pre-intent behaviour."
                signedTransactions:
                  type: array
                  items:
                    type: string
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 20
                currency:
                  type: string
                  description: SPL mint address to pay in; must be one of the machine's `acceptedCurrencies`. Defaults to the machine's `currency` (USDC).
                  example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                player:
                  type: string
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  description: "Player wallet the platform must deliver the won items to. Attribution follows delivery, so pass the same wallet on every poll. Required whenever `signedTransactions` are present: the payment settles for this wallet, and omitting it makes the platform reject the transaction the buyer signed. It must also be the wallet that signed those transactions, and the one the `reference` was issued to, a mismatch is rejected with 400 rather than delivering one wallet's cards against another wallet's payment."
      responses:
        "200":
          description: Open result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineOpenResult"
        "400":
          description: Malformed request, a required field is missing or invalid
        "404":
          description: Not found
        "409":
          description: The machine sold out before the payment settled, nothing was charged
        "410":
          description: Purchase reference expired, call purchase again for a fresh transaction
        "451":
          description: Unavailable in the caller's region
        "501":
          description: Platform doesn't support open through this API
        "502":
          description: Platform unavailable
  /machines/{id}:
    get:
      summary: One machine by id
      tags:
        - Machines
      parameters:
        - schema:
            type: string
            description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          required: true
          description: "`{platform}:{platformMachineId}`. Paste the raw id, no surrounding quotes."
          name: id
          in: path
          example: phygitals:starter-one-piece-pack-2xcfbo
      responses:
        "200":
          description: Machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineV2"
        "404":
          description: Not found
      description: One machine by its `${platform}:${externalId}` id, in the same shape as the list. Sold-out and inactive machines resolve here even though `GET /gacha/gacha/v2/machines` omits them by default.
  /packs:
    get:
      summary: Jupiter's pack catalogue
      description: "The packs Jupiter sells, in our own name, with our art and our merchandising order, one entry per curated pack, bound to a provider machine. Unlike /gacha/v2/machines this never drops a pack: one that is not buyable is still returned, with `available: false` and a machine-readable `unavailableReason`, so a client can render a coming-soon or sold-out tile. Retired packs are the one omission, pass `include=unlisted` for those. Price and odds are read live off the bound machine, and are absent as a group whenever it could not be resolved, a degraded platform (named in `x-degraded-sources`), but also a pack the provider does not list yet. Check `priceUsd`, not `unavailableReason`. Cached 30s."
      tags:
        - Packs
      parameters:
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            description: Filter to featured packs
          required: false
          description: Filter to featured packs
          name: featured
          in: query
        - schema:
            type: string
          required: false
          name: tag
          in: query
        - schema:
            type: string
            description: Filter by backing platform
          required: false
          description: Filter by backing platform
          name: platform
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            description: "`true` returns buyable packs only, `false` only the ones that are not. Omitted, both are returned, the default, so a client can render coming-soon and sold-out tiles."
          required: false
          description: "`true` returns buyable packs only, `false` only the ones that are not. Omitted, both are returned, the default, so a client can render coming-soon and sold-out tiles."
          name: available
          in: query
        - schema:
            type: string
            enum:
              - unlisted
            description: Pass `unlisted` to include retired packs, which browse surfaces omit. They remain reachable at GET /gacha/gacha/v2/packs/{slug} either way.
          required: false
          description: Pass `unlisted` to include retired packs, which browse surfaces omit. They remain reachable at GET /gacha/gacha/v2/packs/{slug} either way.
          name: include
          in: query
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackV2"
  /packs/categories:
    get:
      summary: The category tabs
      description: The categories a storefront groups packs under, in tab order. A pack belongs to a category when its `tags` carry the category's `id`; the pack's `category` field already resolves that, so a client only has to bucket. A pack whose tags name no category goes in an all-packs view alone. Icons are the client's, key them by `id`. Cached 300s.
      tags:
        - Packs
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackCategory"
  /packs/{slug}:
    get:
      summary: One pack by slug
      description: "The pack detail. Buy with the `machineId` this returns, via POST /gacha/gacha/v2/machines/{id}/purchase, there is no pack-scoped purchase route. Draft and archived packs are not public and return 404. Retired packs (`listed: false`) resolve here normally even though GET /gacha/gacha/v2/packs omits them, so existing links keep working. A degraded backing platform is named in `x-degraded-sources`, the same as on the list."
      tags:
        - Packs
      parameters:
        - schema:
            type: string
          required: true
          name: slug
          in: path
        - schema:
            type: string
            enum:
              - machine
            description: Pass `machine` to inline the full normalised machine
          required: false
          description: Pass `machine` to inline the full normalised machine
          name: include
          in: query
      responses:
        "200":
          description: Pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackV2"
        "404":
          description: No published pack with that slug
  /collections:
    get:
      summary: Whitelisted gacha collections
      description: Every collection eligible as a gacha collectible, with its label, the collectible standard its enrichment follows, and which enrichment sources are configured. Valid values for /gacha/v2/inventory's `collection` filter.
      tags:
        - Collections
      parameters:
        - schema:
            type: string
            description: Filter to one platform
          required: false
          description: Filter to one platform
          name: platform
          in: query
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
  /marketplace:
    get:
      summary: Browse marketplace listings
      description: Normalised listings browse per platform. `platform` is required, upstream marketplaces paginate independently, so cross-platform pages can't be merged coherently. Phygitals listings live on Tensor / Magic Eden (see `source`).
      tags:
        - Marketplace
      parameters:
        - schema:
            type: string
          required: true
          name: platform
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: minPriceUsd
          in: query
        - schema:
            type:
              - number
              - "null"
          required: false
          name: maxPriceUsd
          in: query
        - schema:
            type: boolean
            default: true
          required: false
          name: listedOnly
          in: query
        - schema:
            type: string
            enum:
              - price
              - name
              - value
            description: Recently-listed first when omitted. collector-crypt has no value ordering (falls back to price).
          required: false
          description: Recently-listed first when omitted. collector-crypt has no value ordering (falls back to price).
          name: sort
          in: query
        - schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          required: false
          name: order
          in: query
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPage"
        "400":
          description: Unknown platform
        "502":
          description: Platform unavailable
  /marketplace/{asset}:
    get:
      summary: Market state of one asset
      description: Listing status, price, offer count, and instant-sell quote for a whitelisted asset. The platform is inferred from the asset's collection.
      tags:
        - Marketplace
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            description: NFT mint address
          required: true
          description: NFT mint address
          name: asset
          in: path
      responses:
        "200":
          description: Market state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketState"
        "404":
          description: Unknown or non-whitelisted asset
        "501":
          description: Collection has no marketplace integration
        "502":
          description: Platform unavailable
  /marketplace/{asset}/buy:
    post:
      summary: Buy a listed asset
      description: Builds the purchase transaction for the active listing (collector-crypt only, Phygitals listings settle on Tensor / Magic Eden). Returns unsigned transaction(s) and a gateway `reference`; complete via POST /gacha/gacha/v2/transactions/submit.
      tags:
        - Marketplace
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            description: NFT mint address
          required: true
          description: NFT mint address
          name: asset
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet:
                  type: string
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  description: Buyer wallet
              required:
                - wallet
      responses:
        "200":
          description: Transaction plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTxPlan"
        "400":
          description: Not listed / bad request
        "403":
          description: The wallet does not hold this asset
        "404":
          description: Unknown asset
        "451":
          description: Unavailable in the caller's region
        "501":
          description: Unsupported on this platform
        "502":
          description: Platform unavailable
  /marketplace/{asset}/sell:
    post:
      summary: Instant-sell into the platform's standing bid (deprecated)
      deprecated: true
      description: "Deprecated, use POST /gacha/gacha/v2/buyback/{asset}, or POST /gacha/gacha/v2/buyback to sell several at once. Identical behaviour and response; only the path changed, because selling into the platform's own standing bid is a buyback rather than a marketplace trade. collector-crypt: gacha buyback. phygitals: take-claw-bid, priced for the seller's wallet, which co-signs and receives the proceeds (requires a configured API key). Returns unsigned transaction(s) and a gateway `reference`; complete via POST /gacha/gacha/v2/transactions/submit."
      tags:
        - Marketplace
      parameters:
        - schema:
            type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
            description: NFT mint address
          required: true
          description: NFT mint address
          name: asset
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet:
                  type: string
                  pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                  description: Seller wallet
              required:
                - wallet
      responses:
        "200":
          description: Transaction plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTxPlan"
        "400":
          description: Not listed / bad request
        "403":
          description: The wallet does not hold this asset
        "404":
          description: Unknown asset
        "451":
          description: Unavailable in the caller's region
        "501":
          description: Unsupported on this platform
        "502":
          description: Platform unavailable
  /marketplace/{asset}/list:
    post:
      summary: Create a marketplace listing
      description: collector-crypt only. 2% platform fee is deducted from seller proceeds. Returns unsigned transaction(s) and a gateway `reference`; complete via POST /gacha/gacha/v2/transactions/submit.
      tags:
        - Marketplace
      parameters:
        - schema:
            type: string
